<!doctype html>
<html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登入｜預算分析</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><main class="container py-5" style="max-width:520px">
  <div class="card shadow-sm"><div class="card-header bg-primary text-white"><h1 class="h4 mb-0">預算分析系統登入</h1></div>
    <div class="card-body p-4">
      {% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}{% endwith %}
      <p class="text-muted">請使用管理者或部門帳號登入。</p>
      <form method="post" action="{{ url_for('login', next=request.args.get('next','')) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="mb-3"><label class="form-label" for="username">帳號</label><input class="form-control" id="username" name="username" autocomplete="username" required></div>
        <div class="mb-3"><label class="form-label" for="password">密碼</label><input class="form-control" id="password" type="password" name="password" autocomplete="current-password" required></div>
        <button class="btn btn-primary w-100" type="submit">登入</button>
      </form>
    </div></div>
</main></body></html>
