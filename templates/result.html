<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>{{ dept_name }} - AI 決策報告</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f7f6; }
        .container { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 900px; margin: auto; }
        h2 { color: #003366; border-bottom: 2px solid #003366; padding-bottom: 10px; }
        .report-box { background: #fdfefe; border: 1px solid #d1e7dd; padding: 25px; border-radius: 6px; line-height: 1.8; white-space: pre-wrap; font-size: 15px; color: #2c3e50; }
        pre { background: #f8f9fa; padding: 15px; border-radius: 5px; font-size: 13px; }
        a { display: inline-block; margin-top: 25px; color: #fff; background: #003366; padding: 10px 20px; border-radius: 5px; text-decoration: none; }
        a:hover { background: #002244; }
    </style>
</head>
<body>
<div class="container">
    <h2>📊 {{ dept_name }} - 高階主管 AI 預算決策報告</h2>

    <h3>1. 結合理論與外部爬蟲資料的 AI 智慧分析報告 (五大維度)：</h3>
    <div class="report-box">{{ report }}</div>

    <hr style="margin: 30px 0;">

    <h3>2. 底層模型運算數據細節：</h3>
    <pre>{{ result }}</pre>

    {% if dept_id == 'sales' and result.chart_url %}
        <hr style="margin: 30px 0;">
        <h3>3. 預算使用率與 AI 預測趨勢圖：</h3>
        <img src="{{ result.chart_url }}" alt="預算趨勢圖" style="max-width: 100%; border: 1px solid #ccc; border-radius: 5px;">
    {% endif %}
    
    <br>
    <a href="/">🏠 返回首頁 (Menu)</a>
</div>
</body>
</html>
