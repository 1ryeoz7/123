<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>{{ dept_name }} - 輸入預算參數</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>{{ dept_name }} - 內部預算資料輸入</h1>
        <a href="{{ url_for('department_home', dept_id=dept_id) }}">⬅ 返回部門首頁</a>

        <div class="content-wrapper" style="display: flex; gap: 30px; margin-top: 20px;">
            
            <!-- 左側：使用者輸入表單 (頁面 3) -->
            <div class="form-section" style="flex: 1;">
                <form action="{{ url_for('department_calculate', dept_id=dept_id) }}" method="POST">
                    <div class="form-group">
                        <label for="base_budget">本年度基礎預算 (千元)：</label>
                        <input type="number" id="base_budget" name="base_budget" value="50000" required>
                    </div>

                    <div class="form-group">
                        <label for="growth_rate">部門預期基本成長率 (例如 0.05 代表 5%)：</label>
                        <input type="text" id="growth_rate" name="growth_rate" value="0.05" required>
                    </div>

                    <button type="submit" class="btn-submit" style="margin-top: 15px; padding: 10px 20px;">
                        開始 AI 預算預測與報告生成 ➔
                    </button>
                </form>
            </div>

            <!-- 右側：即時顯示爬蟲抓取到的外部資料 (新增功能) -->
            <div class="market-data-sidebar" style="flex: 1; background: #f8f9fa; padding: 20px; border-radius: 8px; border: 1px solid #dee2e6;">
                <h3>📊 今日最新即時爬蟲市場指標</h3>
                <p style="font-size: 0.9em; color: #666;">以下數據由系統今日自動從官方與市場網站抓取，將直接參與您的預算動態加權運算：</p>
                
                <ul style="list-style-type: none; padding: 0; margin-top: 15px;">
                    {% if market_data %}
                        {% for key, value in market_data.items() %}
                            <li style="padding: 8px 0; border-bottom: 1px solid #e9ecef;">
                                <strong>{{ key }}：</strong> 
                                <span style="color: #007bff; font-weight: bold;">{{ value }}</span>
                            </li>
                        {% endfor %}
                    {% else %}
                        <li>目前尚無即時爬蟲數據，請確認排程是否已執行。</li>
                    {% endif %}
                </ul>
            </div>

        </div>
    </div>
</body>
</html>
